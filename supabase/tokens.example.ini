# Template for tokens.ini, the short form's access tokens. Set it up with:
#
#     cp tokens.example.ini tokens.ini && chmod 600 tokens.ini
#
# then replace each sbp_... with a real token. tokens.ini is git-ignored, and
# the scripts refuse to read it if anyone but you can read it, if git tracks
# it, or if git would not ignore it.
#
# One section per Supabase account, not per project: a token works for EVERY
# project in its account, prod included. A project uses the section named by
# `account =` in projects.ini, or by its own name. Create each token while
# signed in to that account: https://supabase.com/dashboard/account/tokens

[zhiming]
token = sbp_...

[dating]
token = sbp_...
