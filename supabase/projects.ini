# Supabase projects for backup-supabase.sh and restore-supabase.sh, so that
#
#     backup-supabase.sh <project> <env>
#
# needs nothing else. No secrets here: a ref is in every app build anyway.
# Tokens go in tokens.ini, which is not in git (see tokens.example.ini).
#
# [global]
#   backup_root = <dir>    snapshots go to <dir>/<project>/<env>/<timestamp>/
#
# [<project>]
#   <env> = <ref>          one line per environment, e.g. test = abcdefghijklmnopqrst
#   account = <name>       the tokens.ini section with this project's token
#                          (default: the project's own name)
#   backup_dir = <dir>     this project's snapshots go to <dir>/<env>/ instead
#
# Paths are absolute or start with ~/. Comments are lines starting with # or ;
# (or whitespace and # or ; after a value). The file is checked as a whole on
# every run: an unknown setting or a malformed ref anywhere is an error.

[global]
backup_root = /Users/dasongwang/Library/CloudStorage/OneDrive-Personal/backup/app

